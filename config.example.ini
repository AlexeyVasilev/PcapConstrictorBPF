[capture]
# Current BPF build limits both values to MAX_CAPTURE_LEN=4096.
default_snaplen = 4096
max_capture_len = 4096

[tls]
# Bytes kept from the start of the encrypted TLS record once simple TLS
# AppData constriction triggers.
encrypted_snaplen = 8

[quic]
# Bytes kept from the start of a matched QUIC short-header payload.
short_header_keep_packet_bytes = 32

# Documented for future configurability. Current BPF policy still requires a
# directional DCID match and does not constrain unknown short headers.
require_dcid_match = true
allow_short_header_without_known_dcid = false
